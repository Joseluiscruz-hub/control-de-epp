name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # ── Todas las variables se configuran en:
      # ── GitHub → Settings → Secrets and Variables → Actions
      # ── Pestaña "Variables" para las vars.*, pestaña "Secrets" para secrets.*
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'control-de-epp' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Cloud Run API
        run: gcloud services enable run.googleapis.com --project="${PROJECT_ID}"

      - name: Validate deployment secrets
        env:
          KIOSK_SESSION_SECRET: ${{ secrets.KIOSK_SESSION_SECRET }}
        run: |
          if [ "${#KIOSK_SESSION_SECRET}" -lt 32 ]; then
            echo "KIOSK_SESSION_SECRET debe existir y tener mínimo 32 caracteres."
            exit 1
          fi

      - name: Write Cloud Run build env vars
        run: |
          cat > cloud-run-build-env.yaml <<'EOF'
          NEXT_PUBLIC_FIREBASE_API_KEY: '${{ vars.FIREBASE_API_KEY }}'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: '${{ vars.FIREBASE_AUTH_DOMAIN }}'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: '${{ vars.FIREBASE_PROJECT_ID }}'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: '${{ vars.FIREBASE_STORAGE_BUCKET }}'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '${{ vars.FIREBASE_MESSAGING_SENDER_ID }}'
          NEXT_PUBLIC_FIREBASE_APP_ID: '${{ vars.FIREBASE_APP_ID }}'
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: '${{ vars.FIREBASE_DATABASE_ID }}'
          NEXT_PUBLIC_ADMIN_EMAILS: '${{ vars.ADMIN_EMAILS }}'
          NEXT_PUBLIC_DEVELOPER_EMAILS: '${{ vars.DEVELOPER_EMAILS || 'mimonkb222@gmail.com' }}'
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --source . \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --allow-unauthenticated \
            --memory=1Gi \
            --port=8080 \
            --build-env-vars-file=cloud-run-build-env.yaml \
            --set-env-vars="NODE_ENV=production,KIOSK_SESSION_SECRET=${{ secrets.KIOSK_SESSION_SECRET }}" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest"

      - name: Deploy Firestore Rules
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project="${PROJECT_ID}" --token="${{ secrets.FIREBASE_TOKEN }}"
