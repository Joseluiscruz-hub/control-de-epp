name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'control-de-epp' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Cloud Run API
        run: gcloud services enable run.googleapis.com --project="${PROJECT_ID}"

      - name: Create Cloud Run env vars files
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          python3 - <<'PYEOF'
          import os
          import sys

          required = [
            "FIREBASE_API_KEY",
            "FIREBASE_AUTH_DOMAIN",
            "FIREBASE_PROJECT_ID",
            "FIREBASE_STORAGE_BUCKET",
            "FIREBASE_MESSAGING_SENDER_ID",
            "FIREBASE_APP_ID",
            "FIREBASE_DATABASE_ID",
            "ADMIN_EMAILS",
          ]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
            sys.exit("Missing required GitHub variables: " + ", ".join(missing))

          build_vars = {
            "NEXT_PUBLIC_FIREBASE_API_KEY": os.environ["FIREBASE_API_KEY"],
            "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN": os.environ["FIREBASE_AUTH_DOMAIN"],
            "NEXT_PUBLIC_FIREBASE_PROJECT_ID": os.environ["FIREBASE_PROJECT_ID"],
            "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET": os.environ["FIREBASE_STORAGE_BUCKET"],
            "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID": os.environ["FIREBASE_MESSAGING_SENDER_ID"],
            "NEXT_PUBLIC_FIREBASE_APP_ID": os.environ["FIREBASE_APP_ID"],
            "NEXT_PUBLIC_FIREBASE_DATABASE_ID": os.environ["FIREBASE_DATABASE_ID"],
            "NEXT_PUBLIC_ADMIN_EMAILS": os.environ["ADMIN_EMAILS"],
          }

          measurement_id = os.environ.get("FIREBASE_MEASUREMENT_ID", "").strip()
          if measurement_id:
            build_vars["NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID"] = measurement_id

          runtime_vars = {
            "NODE_ENV": "production",
            "FIREBASE_PROJECT_ID": os.environ["FIREBASE_PROJECT_ID"],
            "FIREBASE_DATABASE_ID": os.environ["FIREBASE_DATABASE_ID"],
            "ADMIN_EMAILS": os.environ["ADMIN_EMAILS"],
          }

          def write_yaml(path, values):
            with open(path, "w", encoding="utf-8") as f:
              for key, value in values.items():
                escaped = str(value).replace("'", "''")
                f.write(f"{key}: '{escaped}'\n")

          write_yaml("/tmp/build-env-vars.yaml", build_vars)
          write_yaml("/tmp/runtime-env-vars.yaml", runtime_vars)
          print("Build env vars file created for:", ", ".join(build_vars.keys()))
          print("Runtime env vars file created for:", ", ".join(runtime_vars.keys()))
          PYEOF

      - name: Deploy to Cloud Run
        id: deploy
        continue-on-error: true
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --source . \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --allow-unauthenticated \
            --memory=1Gi \
            --port=8080 \
            --build-env-vars-file=/tmp/build-env-vars.yaml \
            --env-vars-file=/tmp/runtime-env-vars.yaml \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest"
          echo "deploy_exit_code=$?" >> "${GITHUB_OUTPUT}"

      - name: Instrucciones para habilitar Cloud Run Admin API
        if: steps.deploy.outputs.missing_run_api == 'true'
        run: |
          echo "❌ El deploy falló porque la Cloud Run Admin API no está habilitada."
          echo "Habilítala: https://console.developers.google.com/apis/api/run.googleapis.com/overview?project=${PROJECT_ID}"

      - name: Deploy Firestore Rules
        if: steps.deploy.outputs.deploy_exit_code == '0'
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project="${PROJECT_ID}" --token="${{ secrets.FIREBASE_TOKEN }}"

      - name: Fallar workflow si el deploy no fue exitoso
        if: steps.deploy.outputs.deploy_exit_code != '0'
        run: exit 1
