name: Promote to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: Deploy the same main commit to production after staging succeeds
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: control-epp-cloud-run-promotion
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy and smoke test staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
      EXPECTED_DEPLOYMENT_ENVIRONMENT: staging
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'control-de-epp-staging' }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      FIREBASE_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
      ENABLE_BOOTSTRAP_ADMIN: ${{ vars.ENABLE_BOOTSTRAP_ADMIN || 'false' }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
      NEXT_PUBLIC_ENABLE_OFFLINE_MODE: ${{ vars.NEXT_PUBLIC_ENABLE_OFFLINE_MODE || 'false' }}
      FIREBASE_APPCHECK_SITE_KEY: ${{ vars.FIREBASE_APPCHECK_SITE_KEY }}
      FIREBASE_APP_CHECK_REQUIRED: ${{ vars.FIREBASE_APP_CHECK_REQUIRED || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy staging revision
        uses: ./.github/actions/deploy-cloud-run
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          deployer_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  deploy-production:
    name: Approve, deploy and smoke test production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote_to_production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
      EXPECTED_DEPLOYMENT_ENVIRONMENT: production
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'control-de-epp' }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      FIREBASE_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
      ENABLE_BOOTSTRAP_ADMIN: ${{ vars.ENABLE_BOOTSTRAP_ADMIN || 'false' }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
      NEXT_PUBLIC_ENABLE_OFFLINE_MODE: ${{ vars.NEXT_PUBLIC_ENABLE_OFFLINE_MODE || 'false' }}
      FIREBASE_APPCHECK_SITE_KEY: ${{ vars.FIREBASE_APPCHECK_SITE_KEY }}
      FIREBASE_APP_CHECK_REQUIRED: ${{ vars.FIREBASE_APP_CHECK_REQUIRED || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy production revision
        uses: ./.github/actions/deploy-cloud-run
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          deployer_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
