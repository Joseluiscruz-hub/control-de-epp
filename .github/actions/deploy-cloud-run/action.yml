name: Deploy AssetGuard to Cloud Run
description: Build, deploy, apply Firestore rules, and smoke test one protected environment.

inputs:
  project_id:
    description: Google Cloud project that receives the deployment
    required: true
  workload_identity_provider:
    description: Google Cloud Workload Identity Provider resource name
    required: true
  deployer_service_account:
    description: Google Cloud deployer service account email
    required: true

outputs:
  service_url:
    description: URL of the deployed Cloud Run service
    value: ${{ steps.service.outputs.service_url }}

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud with OIDC
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.deployer_service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Validate and create deployment configuration
      shell: bash
      run: node .github/scripts/create-cloud-run-config.mjs

    - name: Deploy Cloud Run revision
      shell: bash
      run: |
        runtime_args=()
        if [[ -n "${RUNTIME_SERVICE_ACCOUNT:-}" ]]; then
          runtime_args+=(--service-account="${RUNTIME_SERVICE_ACCOUNT}")
        fi

        gcloud run deploy "${SERVICE_NAME}" \
          --source . \
          --region="${REGION}" \
          --project="${PROJECT_ID}" \
          --allow-unauthenticated \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --concurrency=40 \
          --timeout=60 \
          --port=8080 \
          --build-env-vars-file=/tmp/build-env-vars.yaml \
          --env-vars-file=/tmp/runtime-env-vars.yaml \
          --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,KIOSK_SESSION_SECRET=KIOSK_SESSION_SECRET:latest" \
          "${runtime_args[@]}" \
          --quiet

    - name: Deploy Firestore rules to the configured database
      shell: bash
      run: |
        npm install --global firebase-tools@15.25.1
        firebase deploy \
          --only firestore \
          --config=.firebase.deploy.json \
          --project="${PROJECT_ID}" \
          --non-interactive

    - name: Resolve service URL
      id: service
      shell: bash
      run: |
        service_url="$(gcloud run services describe "${SERVICE_NAME}" \
          --region="${REGION}" \
          --project="${PROJECT_ID}" \
          --format='value(status.url)')"
        test -n "${service_url}"
        echo "service_url=${service_url}" >> "${GITHUB_OUTPUT}"

    - name: Smoke test deployed revision
      shell: bash
      env:
        SERVICE_URL: ${{ steps.service.outputs.service_url }}
      run: node .github/scripts/smoke-cloud-run.mjs

    - name: Publish deployment summary
      shell: bash
      env:
        SERVICE_URL: ${{ steps.service.outputs.service_url }}
      run: |
        {
          echo "### Cloud Run deployment verified"
          echo "- Project: \`${PROJECT_ID}\`"
          echo "- Service: \`${SERVICE_NAME}\`"
          echo "- Database: \`${FIREBASE_DATABASE_ID}\`"
          echo "- URL: ${SERVICE_URL}"
        } >> "${GITHUB_STEP_SUMMARY}"
